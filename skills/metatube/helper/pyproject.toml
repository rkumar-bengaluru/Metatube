[project]
name = "metatube-helper"
version = "0.1.0"
description = "Deterministic helpers for the MetaTube Claude Code skill"
requires-python = ">=3.12"
dependencies = [
    "ruamel.yaml>=0.18",
    "pydantic>=2.5",
]

[project.scripts]
metatube-helper = "metatube_helper.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/metatube_helper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
