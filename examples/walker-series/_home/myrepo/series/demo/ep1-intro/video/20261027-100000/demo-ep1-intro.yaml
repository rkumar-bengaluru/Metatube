title: "Install and Run Your First SQLite Job | tinyqueue Tour Ep. 1"
description: |
  Install tinyqueue, the Python job queue that stores jobs in one SQLite file, and run a first background job — no Redis needed.

  We pip install tinyqueue, write a task, enqueue it from the Python shell, look at the pending row in the jobs table with sqlite3, and watch a worker in a second terminal run it. Made for Python developers who want background jobs without extra servers.

