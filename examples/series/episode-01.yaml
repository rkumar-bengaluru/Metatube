title: "tinyqueue Deep Dive Ep. 1: How the SQLite Job Queue Works"
description: |
  See how tinyqueue stores Python background jobs in SQLite and how workers claim them safely without double-processing.

  We read the tinyqueue source on GitHub: the jobs table, claiming jobs with UPDATE … RETURNING inside a transaction, why WAL mode matters for concurrent workers, and the worker main loop — explained step by step for developers who want to understand, not just use, the library.

